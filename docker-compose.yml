services:
  api:
    build: .
    container_name: flowiq-api
    environment:
      DATABASE_URL: postgresql://flowiq:flowiq@postgres:5432/flowiq
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ENABLE_REDIS_QUEUE: "true"
      RATE_LIMIT_PER_MINUTE: 180
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/cleaned:/app/backend/cleaned
      - ./backend/charts:/app/backend/charts
      - ./backend/reports:/app/backend/reports
      - ./backend/analysis_results:/app/backend/analysis_results
      - ./backend/memory_store:/app/backend/memory_store

  postgres:
    image: postgres:16-alpine
    container_name: flowiq-postgres
    environment:
      POSTGRES_DB: flowiq
      POSTGRES_USER: flowiq
      POSTGRES_PASSWORD: flowiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: flowiq-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: flowiq-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./backend/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.0
    container_name: flowiq-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./backend/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./backend/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  grafana_data:

