version: "3.9"

services:

  backend:

    build: .

    container_name: ai_analyst_backend

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - postgres

  postgres:

    image: postgres:16

    container_name: ai_analyst_postgres

    restart: always

    environment:
      POSTGRES_DB: ai_analyst
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:

    image: n8nio/n8n

    container_name: ai_analyst_n8n

    ports:
      - "5678:5678"

    volumes:
      - n8n_data:/home/node/.n8n

volumes:

  postgres_data:

  n8n_data: